name: Validação

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar skills e agentes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versão do Node.js
        run: node --version

      - name: Validar
        run: node scripts/validate.mjs

      - name: Testar o instalador em modo de simulação
        run: node scripts/install.mjs --target "$RUNNER_TEMP" --all --agents --dry-run
